name: rezayi-foundation

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: rezayi-backend:phase05
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.development
    DATABASE_HOST: ${DATABASE_HOST-host.docker.internal}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  stop_grace_period: 45s
  read_only: true
  volumes:
    - identity_private_data:/app/data
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    redis:
      condition: service_healthy

services:
  web:
    <<: *backend
    command: ["gunicorn", "--config", "gunicorn.conf.py", "--workers", "1", "config.wsgi:application"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live/', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 15s
      retries: 5

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=worker@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/app/run/celerybeat-schedule", "--pidfile=/app/run/celerybeat.pid"]
    volumes:
      - beat_data:/app/run
      - identity_private_data:/app/data
    depends_on:
      worker:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8.2-bookworm@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  identity_private_data:
  redis_data:
  beat_data:
