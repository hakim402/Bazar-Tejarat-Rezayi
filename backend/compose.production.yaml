name: rezayi-production

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  image: rezayi-backend:production
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
  read_only: true
  volumes:
    - identity_private_data:/app/data
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 45s

services:
  web:
    <<: *app
    command: ["gunicorn", "--config", "gunicorn.conf.py", "config.wsgi:application"]
    ports:
      - "127.0.0.1:${PRODUCTION_SMOKE_PORT:-8102}:8000"
  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=WARNING", "--concurrency=1", "--hostname=worker@%h"]
  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=WARNING", "--schedule=/app/run/celerybeat-schedule", "--pidfile=/app/run/celerybeat.pid"]
    volumes:
      - beat_data:/app/run
      - identity_private_data:/app/data
volumes:
  identity_private_data:
  beat_data:
