# Only scripts/run_tests.py supplies these temporary process values. No private env_file.
x-test-environment: &test-environment
  REZAYI_TEST_TRANSLATION_ADAPTER: ${REZAYI_TEST_TRANSLATION_ADAPTER:-disabled}
  HOME: /tmp
  DJANGO_SETTINGS_MODULE: config.settings.test
  OWNER_MFA_REQUIRED: "true"
  REZAYI_TEST_RUN_ID: ${REZAYI_TEST_RUN_ID:?Use scripts/run_tests.py}
  REZAYI_TEST_DATABASE_URL: postgresql://test_${REZAYI_TEST_RUN_ID}:${REZAYI_TEST_DB_PASSWORD}@postgres:5432/test_rezayi_${REZAYI_TEST_RUN_ID}
  REZAYI_TEST_FRONTEND_ORIGIN: http://127.0.0.1:${REZAYI_TEST_FRONTEND_PORT}
  REZAYI_TEST_BROKER_URL: redis://:${REZAYI_TEST_REDIS_PASSWORD}@redis:6379/0
  DJANGO_SECRET_KEY: ${REZAYI_TEST_SIGNING_KEY}
  MFA_ENCRYPTION_KEY: ${REZAYI_TEST_ENCRYPTION_KEY}
x-application: &application
  image: rezayi-test:${REZAYI_TEST_RUN_ID}
  build:
    context: .
    target: test
    labels:
      dev.rezayi.test-run: ${REZAYI_TEST_RUN_ID}
  labels:
    dev.rezayi.test-run: ${REZAYI_TEST_RUN_ID}
  read_only: true
  tmpfs:
    - /tmp
    - /app/data:uid=10001,gid=10001,mode=0700
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    labels:
      dev.rezayi.test-run: ${REZAYI_TEST_RUN_ID}
    environment:
      POSTGRES_DB: test_rezayi_${REZAYI_TEST_RUN_ID}
      POSTGRES_USER: test_${REZAYI_TEST_RUN_ID}
      POSTGRES_PASSWORD: ${REZAYI_TEST_DB_PASSWORD}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 5s
      retries: 60
  redis:
    image: redis:8.2-bookworm@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
    labels:
      dev.rezayi.test-run: ${REZAYI_TEST_RUN_ID}
    environment:
      REDIS_PASSWORD: ${REZAYI_TEST_REDIS_PASSWORD}
    tmpfs: [/data]
    command: [sh, -c, 'exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 1s
      timeout: 5s
      retries: 60
  test:
    <<: *application
    environment:
      <<: *test-environment
      BROWSER_TEST_RUNTIME: "false"
    command: [python, manage.py, test, --settings=config.settings.test, --noinput]
  web:
    <<: *application
    environment:
      <<: *test-environment
      BROWSER_TEST_RUNTIME: "true"
      OWNER_MFA_REQUIRED: ${REZAYI_TEST_OWNER_MFA_REQUIRED:-true}
    command: [gunicorn, --config, gunicorn.conf.py, --workers, "1", config.wsgi:application]
    ports: ["127.0.0.1:${REZAYI_TEST_API_PORT}:8000"]
networks:
  default:
    labels:
      dev.rezayi.test-run: ${REZAYI_TEST_RUN_ID}
