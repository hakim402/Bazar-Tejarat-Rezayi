{% load i18n %}
<dl class="{{ rz_order.muted }}">
    {% for kind, value in contact_fields %}
    <div{% if compact %} class="{{ rz_store.contact_row }}"{% endif %}>
        <dt{% if compact %} class="{{ rz_store.label }}"{% endif %}>{% if kind == "whatsapp" %}WhatsApp{% elif kind == "instagram" %}Instagram{% elif kind == "facebook" %}Facebook{% elif kind == "tiktok" %}TikTok{% else %}{% translate "Website" %}{% endif %}</dt>
        <dd{% if compact %} class="truncate" title="{{ value }}"{% else %} class="break-all"{% endif %}><bdi>{{ value }}</bdi></dd>
    </div>
    {% endfor %}
</dl>
