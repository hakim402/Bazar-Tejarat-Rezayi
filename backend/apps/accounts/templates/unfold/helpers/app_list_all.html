{% load i18n %}
{% if sidebar_show_all_applications and app_list %}
<div class="ra:border-t ra:border-line">
<button type="button" id="all-applications-toggle" x-on:click="openAllApplications = !openAllApplications; $nextTick(() => document.getElementById('all-applications-close').focus())" x-bind:aria-expanded="openAllApplications" aria-controls="all-applications-directory" class="ra:flex ra:min-h-11 ra:w-full ra:items-center ra:gap-3 ra:px-6 ra:py-3 ra:text-sm ra:font-bold ra:text-ink ra:hover:bg-tint"><span data-admin-icon class="material-symbols-outlined" aria-hidden="true">apps</span>{% translate 'All applications' %}</button>
<div id="all-applications-directory" role="dialog" aria-modal="true" aria-labelledby="all-applications-title" x-cloak x-show="openAllApplications" x-trap.noautofocus.noscroll="openAllApplications" x-on:keydown.escape.stop.prevent="openAllApplications = false; document.getElementById('all-applications-toggle').focus()" class="ra:fixed ra:inset-0 ra:z-50 ra:bg-panel ra:p-5 ra:text-ink ra:overflow-y-auto ra:xl:start-72 ra:xl:w-96 ra:xl:border-e ra:xl:border-line">
<div class="ra:flex ra:items-center ra:justify-between ra:gap-3"><h2 id="all-applications-title" class="ra:text-lg ra:font-bold">{% translate 'All applications' %}</h2><button type="button" id="all-applications-close" aria-label="{% translate 'Close applications' %}" x-on:click="openAllApplications = false; document.getElementById('all-applications-toggle').focus()" class="ra:size-11 ra:rounded-lg ra:hover:bg-tint"><span data-admin-icon class="material-symbols-outlined" aria-hidden="true">close</span></button></div>
{% for app in app_list %}<section class="ra:mt-5"><h3 class="ra:font-bold">{{ app.name }}</h3><ul>{% for model in app.models %}{% if model.admin_url %}<li><a href="{{ model.admin_url }}" class="ra:flex ra:min-h-11 ra:items-center ra:rounded-lg ra:px-2 ra:text-sm ra:text-action ra:hover:bg-tint">{{ model.name }}</a></li>{% endif %}{% endfor %}</ul></section>{% endfor %}
</div></div>{% endif %}
