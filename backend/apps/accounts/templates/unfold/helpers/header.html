{% load i18n unfold %}
<div class="rz-admin-header bg-white border-b border-base-200 mb-4 px-4 z-40 dark:bg-base-900 dark:border-base-800 dark:text-font-default-dark">
  <div class="{% if not cl.model_admin.list_fullwidth and is_fullwidth != '1' and not is_popup %}container{% endif %} flex items-center ra:min-h-16 mx-auto py-3">
    <div id="header-inner" class="flex flex-wrap items-center gap-3 relative w-full">
      <div class="flex flex-row grow font-semibold items-center min-w-0">
        {% if is_nav_sidebar_enabled and not is_popup %}
          <button type="button" id="owner-nav-toggle" x-on:click="sidebarToggle(); $nextTick(() => { if (sidebarOpen && innerWidth &lt; 1280) $dispatch('owner-nav-opened') })" x-bind:aria-expanded="sidebarOpen" aria-controls="nav-sidebar" aria-label="{% translate 'Toggle navigation' %}" class="cursor-pointer flex items-center justify-center rounded-default ra:size-8 shrink-0 hover:bg-base-100 hover:text-primary-600 dark:hover:bg-white/[.06]"><span data-admin-icon class="material-symbols-outlined rtl:-scale-x-100" aria-hidden="true">dock_to_right</span></button>
          <span class="block bg-base-200 h-5 mx-3 w-px dark:bg-base-700" aria-hidden="true"></span>
        {% endif %}
        {% if not is_popup %}{% include 'unfold/helpers/header_back_button.html' %}{% endif %}
        <h1 class="min-w-0 leading-5 text-important flex flex-wrap items-center xl:text-base">{% header_title %}</h1>
      </div>
      {% if has_permission and not is_popup %}
        <div class="flex flex-row flex-wrap gap-3 items-center ms-auto">
          {% action_list %}
          {{ nav_global_side }}
        </div>
      {% endif %}
    </div>
  </div>
</div>
