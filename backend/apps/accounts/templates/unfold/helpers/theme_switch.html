{% load i18n %}
{% if not theme %}
<div class="@container border-b border-base-200 flex flex-row gap-1 mb-1 pb-1 px-2 dark:border-base-700" role="group" aria-label="{% translate 'Appearance' %}">
  <button type="button" x-on:click="switchTheme('light')" x-bind:aria-pressed="adminTheme === 'light'" class="cursor-pointer flex flex-row gap-2 grow px-2 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200 @max-[240px]:justify-center" x-bind:class="adminTheme == 'light' && 'text-primary-600 dark:text-primary-500 dark:hover:text-primary-500! hover:text-primary-600!'"><span data-admin-icon class="material-symbols-outlined" aria-hidden="true">light_mode</span><span class="leading-none self-center @max-[240px]:hidden">{% translate 'Light' %}</span></button>
  <button type="button" x-on:click="switchTheme('dark')" x-bind:aria-pressed="adminTheme === 'dark'" class="cursor-pointer flex flex-row gap-2 grow px-2 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200 @max-[240px]:justify-center" x-bind:class="adminTheme == 'dark' && 'text-primary-600 dark:text-primary-500 dark:hover:text-primary-500! hover:text-primary-600!'"><span data-admin-icon class="material-symbols-outlined" aria-hidden="true">dark_mode</span><span class="leading-none self-center @max-[240px]:hidden">{% translate 'Dark' %}</span></button>
  <button type="button" x-on:click="switchTheme('auto')" x-bind:aria-pressed="adminTheme === 'auto'" class="cursor-pointer flex flex-row gap-2 grow px-2 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200 @max-[240px]:justify-center" x-bind:class="adminTheme == 'auto' && 'text-primary-600 dark:text-primary-500 dark:hover:text-primary-500! hover:text-primary-600!'"><span data-admin-icon class="material-symbols-outlined" aria-hidden="true">computer</span><span class="leading-none self-center @max-[240px]:hidden">{% translate 'System' %}</span></button>
</div>
{% endif %}
