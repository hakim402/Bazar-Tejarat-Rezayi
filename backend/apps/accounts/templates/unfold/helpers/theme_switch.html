{% load i18n %}
{% if not theme %}
<div class="mt-1 border-t border-base-200 px-2 py-2 dark:border-base-800" role="group" aria-labelledby="owner-appearance-heading">
  <p id="owner-appearance-heading" class="mb-1 {{ rz_account.label }}">{% translate 'Appearance' %}</p>
  <div class="grid grid-cols-3 gap-1 p-1 {{ rz_account.segments }}">
    <button type="button" x-on:click="switchTheme('light')" x-bind:aria-pressed="adminTheme === 'light'"
        class="flex min-w-0 cursor-pointer items-center justify-center gap-1 px-1 py-1.5 text-xs {{ rz_account.trigger }}"
        x-bind:class="adminTheme === 'light' ? '{{ rz_account.selection|escapejs }}' : ''">
      <span data-admin-icon class="material-symbols-outlined text-sm" aria-hidden="true">light_mode</span>{% translate 'Light' %}
    </button>
    <button type="button" x-on:click="switchTheme('dark')" x-bind:aria-pressed="adminTheme === 'dark'"
        class="flex min-w-0 cursor-pointer items-center justify-center gap-1 px-1 py-1.5 text-xs {{ rz_account.trigger }}"
        x-bind:class="adminTheme === 'dark' ? '{{ rz_account.selection|escapejs }}' : ''">
      <span data-admin-icon class="material-symbols-outlined text-sm" aria-hidden="true">dark_mode</span>{% translate 'Dark' %}
    </button>
    <button type="button" x-on:click="switchTheme('auto')" x-bind:aria-pressed="adminTheme === 'auto'"
        class="flex min-w-0 cursor-pointer items-center justify-center gap-1 px-1 py-1.5 text-xs {{ rz_account.trigger }}"
        x-bind:class="adminTheme === 'auto' ? '{{ rz_account.selection|escapejs }}' : ''">
      <span data-admin-icon class="material-symbols-outlined text-sm" aria-hidden="true">computer</span>{% translate 'System' %}
    </button>
  </div>
</div>
{% endif %}
