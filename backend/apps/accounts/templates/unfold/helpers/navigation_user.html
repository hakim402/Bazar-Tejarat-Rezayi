{% load i18n %}
<div class="border-t border-base-200 px-3 py-2 relative dark:border-base-800" x-data="{ openUserLinks: false }">
  <nav aria-label="{% translate 'Account settings' %}" id="owner-user-menu" class="absolute bg-white border border-base-200 flex flex-col leading-none py-1 rounded-default shadow-lg ra:bottom-full mb-2 ra:start-3 ra:end-3 z-50 dark:bg-base-800 dark:border-base-700" x-cloak x-show="openUserLinks" x-transition x-on:click.outside="openUserLinks = false" x-on:keydown.escape="openUserLinks = false; $refs.ownerMenu.focus()">
    {% include 'unfold/helpers/theme_switch.html' %}
    {% include 'unfold/helpers/language_switch.html' %}
    {% include 'unfold/helpers/account_links.html' %}
  </nav>
  <button type="button" x-ref="ownerMenu" x-on:click="openUserLinks = !openUserLinks" x-bind:aria-expanded="openUserLinks" aria-controls="owner-user-menu" class="cursor-pointer flex flex-row gap-3 items-center ra:min-h-14 w-full px-3 rounded-default text-start hover:bg-base-100 dark:hover:bg-base-800" x-bind:class="{'bg-base-100 dark:bg-base-800': openUserLinks}">
    {% include 'unfold/helpers/avatar.html' with user=request.user %}
    <span class="flex flex-col select-none min-w-0 grow">
      <span class="font-semibold text-important tracking-tight truncate">{{ request.user.display_name|default:request.user.get_username }}</span>
      <span class="text-subtle text-xs truncate">{% if request.user.email %}<bdi dir="ltr">{{ request.user.email }}</bdi>{% elif is_owner_admin %}{% translate 'Super admin' %}{% else %}{% translate 'Staff' %}{% endif %}</span>
    </span>
    <span data-admin-icon class="material-symbols-outlined ms-auto select-none text-font-default-light dark:text-font-default-dark" aria-hidden="true">unfold_more</span>
  </button>
</div>
