{% load i18n %}
{% if site_url %}<a href="{{ site_url }}" class="ra:mx-2 ra:flex ra:min-h-11 ra:items-center ra:rounded-lg ra:px-3 ra:text-sm ra:text-ink ra:hover:bg-tint">{% translate 'View site' %}</a>{% endif %}
{% if account_links %}{% for link in account_links %}<a href="{{ link.link }}" class="ra:mx-2 ra:flex ra:min-h-11 ra:items-center ra:rounded-lg ra:px-3 ra:text-sm ra:text-ink ra:hover:bg-tint">{{ link.title }}</a>{% endfor %}{% elif user.has_usable_password %}<a href="{% url 'admin:password_change' %}" class="ra:mx-2 ra:flex ra:min-h-11 ra:items-center ra:rounded-lg ra:px-3 ra:text-sm ra:text-ink ra:hover:bg-tint">{% translate 'Change password' %}</a>{% endif %}
<form method="post" action="{% url 'admin:logout' %}" class="ra:mt-2 ra:border-t ra:border-line ra:px-2 ra:pt-2">{% csrf_token %}<button type="submit" class="ra:flex ra:min-h-11 ra:w-full ra:items-center ra:justify-between ra:rounded-lg ra:px-3 ra:text-sm ra:font-semibold ra:text-ink ra:hover:bg-tint">{% translate 'Log out' %}<span data-admin-icon class="material-symbols-outlined ra:text-lg" aria-hidden="true">logout</span></button></form>
