{% load i18n %}
<div class="rz-admin-brand border-b border-base-200 flex gap-3 items-center h-[65px] mb-4 px-3 dark:border-base-800" x-on:keydown.escape.window="if (sidebarOpen &amp;&amp; window.innerWidth &lt; 1280 &amp;&amp; $event.target instanceof Element &amp;&amp; document.getElementById('nav-sidebar').contains($event.target) &amp;&amp; !$event.target.closest('#owner-user-menu') &amp;&amp; !openCommandResults &amp;&amp; !openAllApplications) { $event.preventDefault(); sidebarToggle(); $nextTick(() => document.getElementById('owner-nav-toggle').focus()) }">
  <div class="flex grow min-w-0 items-center gap-3 px-3">
    {% include 'unfold/helpers/site_logo.html' %}
    {% if site_subheader %}<span class="block bg-base-200 h-5 w-px shrink-0 dark:bg-base-700" aria-hidden="true"></span><span class="min-w-0 truncate text-xs text-subtle">{{ site_subheader }}</span>{% endif %}
  </div>
  <button type="button" id="owner-sidebar-close" x-on:owner-nav-opened.window="$el.focus()" x-on:keydown.escape.stop.prevent="sidebarToggle(); document.getElementById('owner-nav-toggle').focus()" x-on:click="sidebarToggle(); document.getElementById('owner-nav-toggle').focus()" aria-label="{% translate 'Close navigation' %}" class="flex items-center justify-center rounded-default ra:size-8 shrink-0 hover:bg-base-100 dark:hover:bg-white/[.06] xl:hidden!"><span data-admin-icon class="material-symbols-outlined" aria-hidden="true">close</span></button>
</div>
