{% load i18n %}
<a href="{{ metric.url }}" class="group flex min-w-0 flex-col overflow-hidden {{ rz_theme.card }} {{ rz_theme.card_hover }} {{ rz_theme.text }}" data-testid="dashboard-metric">
  <div class="flex-1 px-6 py-5">
    <div class="flex items-start justify-between gap-2">
      <p class="text-sm {{ rz_theme.muted }} group-hover:text-primary-600">{{ metric.label }}</p>
      <span class="{{ rz_theme.icon_tile }} h-8 w-8"><span data-admin-icon class="material-symbols-outlined text-lg" aria-hidden="true">{{ metric.icon }}</span></span>
    </div>
    <p class="text-3xl font-bold tracking-tight" style="font-variant-numeric:tabular-nums" data-testid="metric-value"><bdi dir="ltr">{{ metric.value }}</bdi></p>
    <p class="mt-1 text-xs leading-5 {{ rz_theme.muted }}">{{ metric.note }}</p>
  </div>
  <div class="flex flex-wrap items-center gap-2 border-t {{ rz_theme.divider }} px-6 py-3 text-sm {{ rz_theme.muted }}">
    {% if metric.delta %}{% include 'accounts/admin/includes/delta_chip.html' with delta=metric.delta %}{% endif %}
    <span class="ms-auto {{ rz_theme.chip }}">{% if metric.chip %}{{ metric.chip }}{% else %}{% translate 'Last 7 days' %}{% endif %}</span>
  </div>
</a>
