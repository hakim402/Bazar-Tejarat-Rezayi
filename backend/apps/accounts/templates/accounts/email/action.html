<!doctype html><html lang="{{ locale }}" dir="{{ direction }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title></head>
<body style="margin:0;background:#eef4fa;color:#18324b;font-family:Tahoma,Arial,sans-serif;line-height:1.9">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">{{ preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:580px;background:#fff;border:1px solid #dbe6ef;border-radius:12px">
<tr><td style="padding:32px 28px 20px;border-bottom:3px solid #0270d2"><img src="cid:rezayi-brand" alt="{{ brand }}" width="210" style="display:block;width:210px;max-width:100%;height:auto"><p style="margin:12px 0 0;font-weight:bold;color:#005bab">{{ brand }}</p></td></tr>
<tr><td style="padding:28px"><h1 style="font-size:25px;line-height:1.6;margin:0 0 18px">{{ title }}</h1><p><bdi dir="auto">{{ name }}</bdi></p><p>{{ instructions }}</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0"><tr><td bgcolor="#0270d2" style="border-radius:7px"><a href="{{ url }}" style="display:inline-block;padding:12px 24px;color:white;text-decoration:none;font-weight:bold">{{ cta }}</a></td></tr></table>
<p style="font-weight:bold">{{ expiry }}</p><p>{{ ignore }}</p><p style="margin-top:28px;font-size:14px">{{ fallback }}</p><p dir="ltr" style="direction:ltr;text-align:left;word-break:break-all;overflow-wrap:anywhere;font-size:13px"><a href="{{ url }}" style="color:#005bab">{{ url }}</a></p></td></tr>
<tr><td style="padding:20px 28px;background:#f5f8fc;border-radius:0 0 12px 12px;font-size:13px">{{ footer }} · {{ brand }}</td></tr>
</table></td></tr></table></body></html>
